<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Неон-бег 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&display=swap">
<style>
:root{--bg:#12062e;--cyan:#19f6ff;--pink:#ff2bd6;--amber:#ffb300;--ink:#f4eaff;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12062e}}
:root[data-theme="dark"]{--bg:#12062e}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Orbitron",system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#app{position:relative;height:100%;max-width:560px;margin:0 auto}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;inset:14px 18px auto;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#score{font-size:42px;font-weight:900;line-height:1;color:var(--cyan);text-shadow:0 0 6px var(--cyan),0 0 22px var(--cyan)}
#score small{font-size:14px;font-weight:500;margin-left:4px}
#best{font-size:12px;font-weight:500;text-align:right;color:var(--pink);text-shadow:0 0 10px var(--pink)}
#best b{display:block;font-size:22px;font-weight:900}
#panel{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:24px 22px 34px;background:linear-gradient(transparent 20%,rgba(18,6,46,.92) 62%)}
#panel.hide{display:none}
h1{font-size:44px;font-weight:900;line-height:1.02;margin-bottom:12px;color:var(--pink);text-shadow:0 0 8px var(--pink),0 0 30px var(--pink)}
#sub{font-size:13px;line-height:1.6;font-weight:500;margin-bottom:22px;max-width:38ch}
#res{font-size:13px;font-weight:500;margin-bottom:20px}
#res b{font-size:32px;font-weight:900;display:block;color:var(--cyan);text-shadow:0 0 14px var(--cyan)}
button{font:900 17px "Orbitron",system-ui,sans-serif;color:var(--bg);background:var(--cyan);border:0;border-radius:12px;padding:18px 22px;width:100%;cursor:pointer;box-shadow:0 0 22px rgba(25,246,255,.6)}
button:active{transform:translateY(2px)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#cn{display:block;margin-top:6px;font-size:14px;font-weight:900;color:var(--amber);text-shadow:0 0 8px var(--amber)}
#buffs{font-size:11px;font-weight:900;color:#7dffb0;text-shadow:0 0 8px #7dffb0;margin-top:6px;min-height:14px}
.alt{margin-top:10px;background:transparent;color:var(--cyan);box-shadow:inset 0 0 0 2px var(--cyan)}
button:disabled{opacity:.5;cursor:default}
#shop{position:fixed;inset:0;z-index:5;background:rgba(18,6,46,.98);overflow-y:auto;touch-action:pan-y;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(28px + env(safe-area-inset-bottom,0px))}
#shop.hide{display:none}
.sin{max-width:560px;margin:0 auto}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sh h1{font-size:28px;margin:0}
.bal{font-size:22px;font-weight:900;color:var(--amber);text-shadow:0 0 12px var(--amber)}
#shop h2{font-size:13px;font-weight:500;margin:18px 0 10px;color:var(--cyan)}
.it{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid rgba(25,246,255,.35);border-radius:12px;margin-bottom:10px}
.sw{width:34px;height:34px;flex:none;border:2px solid currentColor;box-shadow:0 0 10px currentColor,inset 0 0 8px currentColor}
.tx{flex:1;font-size:14px;font-weight:900}
.tx small{display:block;font-size:11px;font-weight:500;opacity:.8;margin-top:3px;line-height:1.4}
.it button{width:auto;padding:10px 12px;font-size:12px;box-shadow:none}
#back{margin-top:8px}
</style>
</head>
<body>
<div id="app">
<canvas id="c" aria-label="Игровое поле"></canvas>
<div id="hud"><div><div id="score">0<small>м</small></div><div id="buffs"></div></div><div id="best">рекорд<b id="bv">0</b><span id="cn">◆ <span id="coins">0</span></span></div></div>
<div id="panel">
<h1 id="title">Неон-бег</h1>
<p id="sub">Свайп влево или вправо меняет полосу, свайп вверх даёт прыжок. Прыгай через оранжевые барьеры, объезжай розовые блоки, лови жёлтые кристаллы. На компьютере: стрелки.</p>
<div id="res" hidden></div>
<button id="go">Старт</button>
<button id="shopb" class="alt">Магазин</button>
</div>
</div>
<div id="shop" class="hide"><div class="sin"><div class="sh"><h1>Магазин</h1><div class="bal">◆ <span id="sc">0</span></div></div><div id="list"></div><button id="back">Назад</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var cv=$('c'),renderer;
if(!window.THREE){$('sub').textContent='Не удалось загрузить 3D-движок. Проверь соединение и обнови страницу.';$('go').hidden=true;return}
try{renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true})}catch(e){$('sub').textContent='Этот браузер не поддерживает 3D-графику.';$('go').hidden=true;return}

var BG=0x12062e,CY=0x19f6ff,PK=0xff2bd6,AM=0xffb300,YL=0xffe83a;
renderer.setClearColor(BG);
var scene=new THREE.Scene();scene.fog=new THREE.Fog(BG,30,120);
var cam=new THREE.PerspectiveCamera(62,1,.1,400);
function resize(){
  var w=cv.clientWidth,h=cv.clientHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.setSize(w,h,false);
  cam.aspect=w/h;cam.fov=cam.aspect<.8?78:62;cam.updateProjectionMatrix();
}
window.addEventListener('resize',resize);resize();

function neon(geo,color,fill){
  var g=new THREE.Group();
  g.add(new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:fill})));
  g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:color})));
  return g;
}
var LANE=2.4;
var pTall=neon(new THREE.BoxGeometry(1.8,2.3,1.2),PK,.34);
var pLow=neon(new THREE.BoxGeometry(1.8,.7,.5),AM,.3);
var pOrb=neon(new THREE.OctahedronGeometry(.45),YL,.4);
var pPil=neon(new THREE.BoxGeometry(1,7,1),CY,.12);

/* floor */
var tc=document.createElement('canvas');tc.width=tc.height=128;
var t=tc.getContext('2d');t.fillStyle='#12062e';t.fillRect(0,0,128,128);
t.strokeStyle='#ff2bd6';t.lineWidth=4;t.strokeRect(0,0,128,128);
var tex=new THREE.CanvasTexture(tc);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(14,70);tex.anisotropy=4;
var floor=new THREE.Mesh(new THREE.PlaneGeometry(56,280),new THREE.MeshBasicMaterial({map:tex}));
floor.rotation.x=-Math.PI/2;floor.position.set(0,0,-120);scene.add(floor);
[-1.2,1.2].forEach(function(x){
  var l=new THREE.Mesh(new THREE.PlaneGeometry(.08,280),new THREE.MeshBasicMaterial({color:CY}));
  l.rotation.x=-Math.PI/2;l.position.set(x,.02,-120);scene.add(l);
});
/* sun */
var sc=document.createElement('canvas');sc.width=sc.height=256;
var x=sc.getContext('2d'),gr=x.createLinearGradient(0,0,0,256);
gr.addColorStop(0,'#ffe83a');gr.addColorStop(1,'#ff2bd6');
x.fillStyle=gr;x.beginPath();x.arc(128,128,124,0,6.283);x.fill();
x.globalCompositeOperation='destination-out';
for(var k=0;k<7;k++){x.fillRect(0,130+k*18,256,2+k*2)}
var sun=new THREE.Mesh(new THREE.PlaneGeometry(110,110),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sc),transparent:true,fog:false}));
sun.position.set(0,32,-230);scene.add(sun);
/* pillars */
var pillars=[];
for(var i=0;i<10;i++)[-1,1].forEach(function(sd){
  var p=pPil.clone();p.position.set(sd*8,3.5,-i*20);scene.add(p);pillars.push(p);
});
/* player */
var SK=[{id:'cyan',n:'Циан',c:0x19f6ff,s:'box',p:0},{id:'pink',n:'Фуксия',c:0xff2bd6,s:'octa',p:50},{id:'amber',n:'Янтарь',c:0xffb300,s:'tetra',p:90},{id:'lime',n:'Кислота',c:0x9dff2b,s:'ico',p:140},{id:'white',n:'Призрак',c:0xffffff,s:'box',p:220}];
var UP=[{id:'shield',n:'Щит',d:'Переживёт одно столкновение в следующем забеге',p:30},{id:'magnet',n:'Магнит',d:'Притягивает кристаллы весь следующий забег',p:30},{id:'x2',n:'Двойные кристаллы',d:'Каждый кристалл даёт 2 ◆ навсегда',p:150,perm:1}];
var GEO={box:[new THREE.BoxGeometry(.9,.9,.9),.45],octa:[new THREE.OctahedronGeometry(.62),.62],tetra:[new THREE.TetrahedronGeometry(.7),.5],ico:[new THREE.IcosahedronGeometry(.55),.55]};
var sv={coins:0,owned:['cyan'],skin:'cyan',shield:0,magnet:0,x2:false};
try{var raw=JSON.parse(localStorage.getItem('neon-save')||'null');if(raw)for(var q in sv)if(q in raw)sv[q]=raw[q]}catch(e){}
function persist(){try{localStorage.setItem('neon-save',JSON.stringify(sv))}catch(e){}}
var player,yb=.45;
function curSkin(){return SK.filter(function(k){return k.id===sv.skin})[0]||SK[0]}
function buildPlayer(){
  if(player)scene.remove(player);
  var k=curSkin(),g=GEO[k.s];yb=g[1];
  player=neon(g[0],k.c,.35);scene.add(player);
}
buildPlayer();
var shieldM=new THREE.Mesh(new THREE.IcosahedronGeometry(1.05,1),new THREE.MeshBasicMaterial({color:0x7dffb0,wireframe:true,transparent:true,opacity:.7}));
shieldM.visible=false;scene.add(shieldM);
$('coins').textContent=sv.coins;

var best=0;
try{best=parseInt(localStorage.getItem('neon-best'),10)||0}catch(e){}
$('bv').textContent=best;

var run=false,S={},shake=0,lastT=performance.now();
function reset(){
  if(S.items)S.items.forEach(function(o){scene.remove(o.m)});
  S={items:[],lane:1,px:0,py:0,vy:0,dist:0,acc:0,bonus:0,spin:0,sh:false,mg:false,earn:0};
}
reset();

function row(){
  var z=-115+S.acc,r=Math.random(),ln=[0,1,2],i;
  if(r<.3){for(i=0;i<3;i++)add(pLow,i,z,'low')}
  else{
    var n=Math.random()<.5?1:2;
    ln.sort(function(){return Math.random()-.5});
    for(i=0;i<n;i++)add(Math.random()<.6?pTall:pLow,ln[i],z,i||Math.random()<.6?'tall':'low',true);
  }
  if(Math.random()<.55)add(pOrb,Math.floor(Math.random()*3),z+9,'orb');
}
function add(proto,lane,z,type,fix){
  if(fix)type=proto===pTall?'tall':'low';
  var m=proto.clone();
  m.position.set((lane-1)*LANE,type==='tall'?1.15:type==='low'?.35:1.1,z);
  scene.add(m);S.items.push({m:m,type:type,z:z});
}
function act(a){
  if(!run)return;
  if(a==='l')S.lane=Math.max(0,S.lane-1);
  else if(a==='r')S.lane=Math.min(2,S.lane+1);
  else if(a==='u'&&S.py===0)S.vy=9.5;
}

function end(){
  run=false;shake=.7;
  var m=Math.floor(S.dist/4)+S.bonus,isNew=m>best,fee=Math.floor(m/25);sv.coins+=fee;S.earn+=fee;persist();$('coins').textContent=sv.coins;
  if(isNew){best=m;try{localStorage.setItem('neon-best',String(best))}catch(e){}}
  $('bv').textContent=best;
  $('title').textContent=isNew?'Новый рекорд!':'Разбился';
  $('sub').hidden=true;
  var r=$('res');r.hidden=false;
  r.innerHTML='Твой счёт<b>'+m+' м</b>'+(isNew?'':'До рекорда не хватило '+(best-m)+'<br>')+'Заработано: +'+S.earn+' ◆';
  $('go').textContent='Ещё раз';
  setTimeout(function(){$('panel').classList.remove('hide')},750);
}
function buffs(){$('buffs').textContent=(S.sh?'ЩИТ ':'')+(S.mg?'МАГНИТ':'')}
function start(){
  if(!$('shop').classList.contains('hide'))return;
  reset();
  if(sv.shield>0){sv.shield--;S.sh=true}
  if(sv.magnet>0){sv.magnet--;S.mg=true}
  persist();buffs();run=true;$('panel').classList.add('hide');
}
$('go').addEventListener('click',start);

function loop(now){
  var dt=Math.min((now-lastT)/1000,.05);lastT=now;
  var sp=run?24+Math.min(S.dist/60,26):12;
  var dz=sp*dt;
  tex.offset.y+=dz/ (280/70);
  pillars.forEach(function(p){p.position.z+=dz;if(p.position.z>8)p.position.z-=200});
  if(run){
    S.dist+=dz;S.acc+=dz;
    var gap=17-Math.min(S.dist/400,5);
    if(S.acc>=gap){S.acc-=gap;row()}
    S.vy-=28*dt;S.py+=S.vy*dt;if(S.py<=0){S.py=0;S.vy=0}
    S.spin=S.py>0?S.spin+dt*9:0;
    for(var i=S.items.length-1;i>=0;i--){
      var o=S.items[i];o.z+=dz;o.m.position.z=o.z;
      if(o.type==='orb')o.m.rotation.y+=dt*3;
      if(o.z>6){scene.remove(o.m);S.items.splice(i,1);continue}
      var dx=Math.abs(o.m.position.x-S.px);
      if(o.type==='orb'){
        if(S.mg&&o.z>-22){o.m.position.x+=(S.px-o.m.position.x)*Math.min(1,dt*7);dx=Math.abs(o.m.position.x-S.px)}
        if(dx<1.1&&Math.abs(o.z)<1.2&&S.py<2.2){scene.remove(o.m);S.items.splice(i,1);S.bonus+=25;var g=sv.x2?2:1;sv.coins+=g;S.earn+=g;$('coins').textContent=sv.coins}
      }else if(dx<1.25&&Math.abs(o.z)<(o.type==='tall'?1.05:.7)){
        if(o.type==='tall'||S.py<.62){
          if(S.sh){S.sh=false;shake=.35;scene.remove(o.m);S.items.splice(i,1);buffs();continue}
          end();break}
      }
    }
    $('score').firstChild.nodeValue=Math.floor(S.dist/4)+S.bonus;
  }
  S.px+=((S.lane-1)*LANE-S.px)*Math.min(1,dt*14);
  player.position.set(S.px,yb+S.py,0);shieldM.visible=!!S.sh&&run;if(shieldM.visible){shieldM.position.copy(player.position);shieldM.rotation.y+=dt*2}
  player.rotation.set(S.spin,0,(S.lane-1)*LANE-S.px>0?-.2:.2*((S.px-(S.lane-1)*LANE)>0?1:0));
  var tz=run||S.items.length?(S.px-(S.lane-1)*LANE)*-.12:0;
  player.rotation.z=tz;
  cam.position.set(S.px*.55,3.3+S.py*.25,6.2);
  if(shake>0){shake-=dt;cam.position.x+=(Math.random()-.5)*shake;cam.position.y+=(Math.random()-.5)*shake}
  cam.lookAt(S.px*.3,1.1,-12);
  renderer.render(scene,cam);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function hex(c){return '#'+('000000'+c.toString(16)).slice(-6)}
function render(){
  $('sc').textContent=sv.coins;
  var h='<h2>Скины</h2>';
  SK.forEach(function(k){
    var own=sv.owned.indexOf(k.id)>-1,on=sv.skin===k.id;
    h+='<div class="it"><div class="sw" style="color:'+hex(k.c)+'"></div><div class="tx">'+k.n+'</div><button data-a="'+(own?'eq':'by')+'" data-i="'+k.id+'"'+(on?' disabled':'')+'>'+(on?'Выбран':own?'Выбрать':k.p+' ◆')+'</button></div>';
  });
  h+='<h2>Усилители</h2>';
  UP.forEach(function(u){
    var done=u.perm&&sv[u.id];
    h+='<div class="it"><div class="tx">'+u.n+(u.perm?'':' ×'+sv[u.id])+'<small>'+u.d+'</small></div><button data-a="up" data-i="'+u.id+'"'+(done?' disabled':'')+'>'+(done?'Куплено':u.p+' ◆')+'</button></div>';
  });
  $('list').innerHTML=h;
}
$('list').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||b.disabled)return;
  var a=b.dataset.a,id=b.dataset.i,k,u;
  if(a==='eq'){sv.skin=id;buildPlayer()}
  else if(a==='by'){
    k=SK.filter(function(z){return z.id===id})[0];
    if(sv.coins<k.p){b.textContent='Не хватает';return}
    sv.coins-=k.p;sv.owned.push(id);sv.skin=id;buildPlayer();
  }else if(a==='up'){
    u=UP.filter(function(z){return z.id===id})[0];
    if(sv.coins<u.p){b.textContent='Не хватает';return}
    sv.coins-=u.p;
    if(u.perm)sv[id]=true;else sv[id]=Math.min(9,sv[id]+1);
  }
  persist();$('coins').textContent=sv.coins;render();
});
$('shopb').addEventListener('click',function(){render();$('shop').classList.remove('hide')});
$('back').addEventListener('click',function(){$('shop').classList.add('hide')});

var sx=0,sy=0,done=true;
cv.addEventListener('pointerdown',function(e){sx=e.clientX;sy=e.clientY;done=false});
cv.addEventListener('pointermove',function(e){
  if(done)return;var dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)>28||Math.abs(dy)>28){
    act(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy<0?'u':null));done=true;
  }
});
cv.addEventListener('pointerup',function(e){
  if(done)return;done=true;
  var w=cv.clientWidth,rel=(e.clientX-cv.getBoundingClientRect().left)/w;
  act(rel<.33?'l':rel>.67?'r':'u');
});
window.addEventListener('keydown',function(e){
  var k=e.key;
  if(k==='ArrowLeft'||k==='a')act('l');
  else if(k==='ArrowRight'||k==='d')act('r');
  else if(k==='ArrowUp'||k==='w'||k===' '){
    e.preventDefault();
    if(run)act('u');else if(!$('panel').classList.contains('hide'))start();
  }else if(k==='Enter'&&!run&&!$('panel').classList.contains('hide'))start();
});
})();
</script>
</body>
</html>
